<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thẻ Từ Vựng HSK4 — Bài 6-10</title>
<style>
  :root{
    --l6-a:#7950f2; --l6-b:#a98bff; --l6-bg:#f3eeff;
    --l7-a:#ff5e78; --l7-b:#ff8fa3; --l7-bg:#fff0f3;
    --l8-a:#3d8bff; --l8-b:#7db2ff; --l8-bg:#eef5ff;
    --l9-a:#12b886; --l9-b:#63e6be; --l9-bg:#eafff6;
    --l10-a:#ff9800; --l10-b:#ffc266; --l10-bg:#fff7e8;
    --ink:#232333; --card-radius:26px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(135deg,#f4f0ff 0%, #eafcff 50%, #fff5ec 100%);
    color:var(--ink); min-height:100vh; padding-bottom:60px;
  }
  header{
    text-align:center; padding:34px 16px 20px;
  }
  header h1{
    font-size:clamp(28px,5vw,44px); margin:0 0 6px;
    background:linear-gradient(90deg,#ff5e78,#3d8bff,#12b886,#ff9800);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:900;
  }
  header p{ font-size:18px; color:#555; margin:0; }

  .lesson-tabs{
    display:flex; justify-content:center; gap:12px; flex-wrap:wrap; padding:0 12px 18px;
  }
  .lesson-tab{
    border:none; cursor:pointer; padding:12px 20px; border-radius:999px;
    font-size:18px; font-weight:800; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,0.12);
    transition:transform .12s ease; opacity:.55;
  }
  .lesson-tab:hover{ transform:translateY(-2px); }
  .lesson-tab.active{ opacity:1; transform:translateY(-3px) scale(1.04); }
  .lesson-tab[data-l="L6"]{ background:linear-gradient(135deg,var(--l6-a),var(--l6-b)); }
  .lesson-tab[data-l="L7"]{ background:linear-gradient(135deg,var(--l7-a),var(--l7-b)); }
  .lesson-tab[data-l="L8"]{ background:linear-gradient(135deg,var(--l8-a),var(--l8-b)); }
  .lesson-tab[data-l="L9"]{ background:linear-gradient(135deg,var(--l9-a),var(--l9-b)); }
  .lesson-tab[data-l="L10"]{ background:linear-gradient(135deg,var(--l10-a),var(--l10-b)); }

  .lesson-title{
    text-align:center; font-size:clamp(20px,3.2vw,28px); font-weight:800; margin:6px 0 22px;
    padding:10px 18px;
  }

  .mode-tabs{
    max-width:900px; margin:0 auto 26px; display:flex; justify-content:center; gap:10px;
    background:#ffffffaa; border-radius:18px; padding:8px; flex-wrap:wrap;
  }
  .mode-tab{
    border:none; background:transparent; cursor:pointer; padding:12px 20px; border-radius:14px;
    font-size:16px; font-weight:700; color:#555;
  }
  .mode-tab.active{ background:var(--accent,#333); color:#fff; }

  .panel{ max-width:1000px; margin:0 auto; padding:0 16px; display:none; }
  .panel.active{ display:block; }

  /* ---------- FLASHCARD VIEWER ---------- */
  .viewer{
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .progress{ font-size:16px; font-weight:700; color:#666; }
  .flip-card{
    width:min(560px,92vw); height:min(420px,60vw); perspective:1600px; cursor:pointer;
  }
  .flip-inner{
    position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--card-radius);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 16px 40px rgba(0,0,0,0.18); padding:20px; text-align:center;
  }
  .face-front{
    background:linear-gradient(160deg,var(--accent-a,#ff5e78),var(--accent-b,#ff8fa3)); color:#fff;
  }
  .hanzi-big{ font-size:clamp(64px,16vw,140px); font-weight:900; line-height:1; text-shadow:0 4px 14px rgba(0,0,0,0.2); }
  .hint{ margin-top:14px; font-size:16px; opacity:.9; font-weight:600; }
  .face-back{
    background:#fff; transform:rotateY(180deg); border:6px solid var(--accent-a,#ff5e78); gap:8px;
  }
  .back-pinyin{ font-size:clamp(26px,5.5vw,38px); font-weight:800; color:var(--accent-a,#ff5e78); }
  .back-meaning{ font-size:clamp(20px,4vw,26px); font-weight:700; color:var(--ink); }
  .back-example{ margin-top:10px; background:var(--accent-bg,#fff0f3); border-radius:14px; padding:12px 16px; width:100%; }
  .back-example .zh{ font-size:clamp(20px,4vw,28px); font-weight:700; }
  .back-example .vn{ font-size:15px; color:#666; margin-top:6px; }

  .controls{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn{
    border:none; cursor:pointer; padding:13px 22px; border-radius:14px; font-size:16px; font-weight:800;
    color:#fff; background:var(--accent-a,#333); box-shadow:0 5px 0 rgba(0,0,0,0.15);
  }
  .btn.secondary{ background:#8b8ba0; }
  .btn:active{ transform:translateY(3px); box-shadow:none; }

  .grid-overview{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px; margin-top:20px;
  }
  .mini-card{
    aspect-ratio:1; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800; color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .mini-card.current{ outline:4px solid #232333; }

  /* ---------- FILL BLANK ---------- */
  .fillblank-box{
    background:#fff; border-radius:22px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,0.08);
    text-align:center;
  }
  .fb-sentence{ font-size:clamp(26px,5.5vw,38px); font-weight:800; margin:16px 0; line-height:1.6; }
  .fb-blank{ display:inline-block; min-width:70px; border-bottom:5px solid var(--accent-a,#333); color:var(--accent-a,#333); }
  .fb-hint{ font-size:17px; color:#666; margin-bottom:6px; }
  .fb-options{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:20px 0; }
  .fb-opt{
    border:3px solid #ddd; background:#fafafa; cursor:pointer; padding:14px 26px; border-radius:14px;
    font-size:clamp(22px,4.5vw,30px); font-weight:800;
  }
  .fb-opt.correct{ background:#d3f9d8; border-color:#2f9e44; color:#2f9e44; }
  .fb-opt.wrong{ background:#ffe3e3; border-color:#e03131; color:#e03131; }
  .fb-score{ font-size:18px; font-weight:800; color:#555; margin-top:10px; }

  footer{ text-align:center; color:#999; font-size:14px; margin-top:40px; }

  @media (max-width:480px){
    .hanzi-big{ font-size:88px; }
  }

  /* ===== RESPONSIVE ===== */
  html{ -webkit-text-size-adjust:100%; }
  body{ overflow-x:hidden; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:calc(60px + env(safe-area-inset-bottom)); }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .flip-card{ height:auto; aspect-ratio:4/3; max-height:70vh; }
  .face{ overflow:auto; }
  .back-example .zh, .back-example .vn, .fb-sentence{ overflow-wrap:anywhere; }
  .lesson-title{ padding-left:16px; padding-right:16px; }

  @media (max-width:900px){
    .panel{ padding:0 12px; }
    .grid-overview{ grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); }
    .mini-card{ font-size:22px; }
  }
  @media (max-width:600px){
    header{ padding:22px 12px 12px; }
    header p{ font-size:14px; }
    .lesson-tabs{ gap:8px; padding:0 10px 12px; }
    .lesson-tab{ padding:10px 14px; font-size:14px; box-shadow:0 4px 0 rgba(0,0,0,0.12); flex:1 1 calc(33.33% - 8px); min-width:0; }
    .lesson-title{ font-size:17px; margin:2px 0 14px; padding-top:4px; padding-bottom:4px; }
    .mode-tabs{ margin:0 10px 18px; padding:6px; gap:4px; border-radius:16px; }
    .mode-tab{ flex:1 1 0; min-width:0; padding:10px 4px; font-size:13px; line-height:1.3; }
    .flip-card{ width:100%; aspect-ratio:auto; height:min(380px,62vh); min-height:280px; }
    .face{ padding:14px; }
    .hint{ font-size:14px; }
    .back-meaning{ font-size:19px; }
    .back-example{ padding:10px 12px; }
    .back-example .zh{ font-size:18px; }
    .controls{ width:100%; gap:8px; }
    .controls .btn{ flex:1 1 calc(50% - 8px); padding:14px 10px; font-size:15px; }
    #cardFlip{ flex:1 1 100%; order:-1; }
    .grid-overview{ grid-template-columns:repeat(auto-fill,minmax(60px,1fr)); gap:8px; }
    .mini-card{ font-size:18px; border-radius:10px; }
    .fillblank-box{ padding:18px 14px; border-radius:18px; }
    .fb-hint{ font-size:15px; }
    .fb-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fb-opt{ padding:14px 8px; min-height:54px; }
    .fb-score{ font-size:16px; }
  }
  @media (max-width:360px){
    .lesson-tab{ flex-basis:calc(50% - 8px); }
    .hanzi-big{ font-size:72px; }
    .controls .btn{ flex-basis:100%; }
  }
  @media (min-width:1200px){
    .panel{ max-width:1100px; }
    .flip-card{ width:min(640px,50vw); }
  }
  @media (max-height:500px) and (orientation:landscape){
    header{ padding:10px; }
    header h1{ font-size:24px; }
    .flip-card{ height:min(260px,70vh); min-height:0; aspect-ratio:auto; width:min(420px,70vw); }
    .hanzi-big{ font-size:64px; }
  }
  @media (hover:none){ .lesson-tab:hover{ transform:none; } }
  @media (prefers-reduced-motion:reduce){ .flip-inner, .lesson-tab{ transition:none; } }
</style>
</head>
<body>

<header>
  <h1>📇 Thẻ Từ Vựng HSK4</h1>
  <p>Giáo trình HSK4 chuẩn — Bài 6, 7, 8, 9, 10 · 汉字 · Pinyin · Nghĩa · Ví dụ</p>
</header>

<div class="lesson-tabs" id="lessonTabs"></div>
<div class="lesson-title" id="lessonTitle"></div>

<div class="mode-tabs" id="modeTabs">
  <button class="mode-tab" data-mode="cards">📇 Thẻ từ vựng</button>
  <button class="mode-tab" data-mode="review">🔀 Ôn tập xáo trộn</button>
  <button class="mode-tab" data-mode="fill">✏️ Điền từ vào chỗ trống</button>
</div>

<!-- FLASHCARDS PANEL -->
<div class="panel" id="panel-cards">
  <div class="viewer">
    <div class="progress" id="cardsProgress"></div>
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="face face-front">
          <div class="hanzi-big" id="cardHanzi"></div>
          <div class="hint">👆 Chạm vào thẻ để xem phiên âm &amp; nghĩa</div>
        </div>
        <div class="face face-back">
          <div class="back-pinyin" id="cardPinyin"></div>
          <div class="back-meaning" id="cardMeaning"></div>
          <div class="back-example">
            <div class="zh" id="cardExampleZh"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn secondary" id="cardPrev">◀ Trước</button>
      <button class="btn" id="cardFlip">🔄 Lật thẻ</button>
      <button class="btn secondary" id="cardNext">Tiếp ▶</button>
    </div>
    <div class="grid-overview" id="cardsGrid"></div>
  </div>
</div>

<!-- REVIEW (SHUFFLE) PANEL -->
<div class="panel" id="panel-review">
  <div class="viewer">
    <div class="progress" id="reviewProgress"></div>
    <div class="flip-card" id="reviewCard">
      <div class="flip-inner">
        <div class="face face-front">
          <div class="hanzi-big" id="reviewHanzi"></div>
          <div class="hint">Đọc to lên rồi chạm để kiểm tra!</div>
        </div>
        <div class="face face-back">
          <div class="back-pinyin" id="reviewPinyin"></div>
          <div class="back-meaning" id="reviewMeaning"></div>
          <div class="back-example">
            <div class="zh" id="reviewExampleZh"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn secondary" id="reviewShuffle">🔀 Xáo trộn lại</button>
      <button class="btn" id="reviewNext">Từ tiếp theo ▶</button>
    </div>
  </div>
</div>

<!-- FILL BLANK PANEL -->
<div class="panel" id="panel-fill">
  <div class="fillblank-box">
    <div class="progress" id="fillProgress"></div>
    <div class="fb-hint" id="fillMeaningHint"></div>
    <div class="fb-sentence" id="fillSentence"></div>
    <div class="fb-options" id="fillOptions"></div>
    <div class="controls">
      <button class="btn secondary" id="fillRestart">🔁 Làm lại từ đầu</button>
      <button class="btn" id="fillNext">Câu tiếp theo ▶</button>
    </div>
    <div class="fb-score" id="fillScore"></div>
  </div>
</div>

<footer>Được biên soạn từ nội dung HSK Standard Course 4 — Bài 6, 7, 8, 9, 10</footer>

<script>

<script>
const LESSON_COLORS = {
  L6: {a:'#7950f2', b:'#a98bff', bg:'#f3eeff'},
  L7: {a:'#ff5e78', b:'#ff8fa3', bg:'#fff0f3'},
  L8: {a:'#3d8bff', b:'#7db2ff', bg:'#eef5ff'},
  L9: {a:'#12b886', b:'#63e6be', bg:'#eafff6'},
  L10: {a:'#ff9800', b:'#ffc266', bg:'#fff7e8'}
};
const LESSON_LABELS = {L6:'Bài 6', L7:'Bài 7', L8:'Bài 8', L9:'Bài 9', L10:'Bài 10'};
const LESSON_ORDER = ['L6','L7','L8','L9','L10'];

let currentLesson = 'L6';
let currentMode = 'cards';

// state for card viewer
let cardIndex = 0;
// state for review (shuffled) viewer
let reviewOrder = [];
let reviewIndex = 0;
// state for fill-in-blank
let fillOrder = [];
let fillIndex = 0;
let fillScore = {correct:0, total:0};
let fillAnswered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function applyAccent(lesson){
  const c = LESSON_COLORS[lesson];
  document.documentElement.style.setProperty('--accent-a', c.a);
  document.documentElement.style.setProperty('--accent-b', c.b);
  document.documentElement.style.setProperty('--accent-bg', c.bg);
  document.querySelectorAll('.mode-tab').forEach(btn=>{
    btn.style.setProperty('--accent', c.a);
  });
}

function buildLessonTabs(){
  const wrap = document.getElementById('lessonTabs');
  wrap.innerHTML = '';
  LESSON_ORDER.forEach(l=>{
    const btn = document.createElement('button');
    btn.className = 'lesson-tab' + (l===currentLesson?' active':'');
    btn.dataset.l = l;
    btn.textContent = LESSON_LABELS[l] + ' (' + VOCAB[l].words.length + ' từ)';
    btn.addEventListener('click', ()=>{ selectLesson(l); });
    wrap.appendChild(btn);
  });
}

function selectLesson(l){
  currentLesson = l;
  applyAccent(l);
  document.getElementById('lessonTitle').textContent = VOCAB[l].title;
  document.getElementById('lessonTitle').style.color = LESSON_COLORS[l].a;
  document.querySelectorAll('.lesson-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.l===l);
  });
  cardIndex = 0;
  initReview();
  initFill();
  renderMode();
}

function buildModeTabs(){
  document.querySelectorAll('.mode-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentMode = btn.dataset.mode;
      document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active', b===btn));
      renderMode();
    });
  });
  document.querySelector('.mode-tab[data-mode="cards"]').classList.add('active');
}

function renderMode(){
  document.getElementById('panel-cards').classList.toggle('active', currentMode==='cards');
  document.getElementById('panel-review').classList.toggle('active', currentMode==='review');
  document.getElementById('panel-fill').classList.toggle('active', currentMode==='fill');
  if(currentMode==='cards') renderCard();
  if(currentMode==='review') renderReview();
  if(currentMode==='fill') renderFill();
}

/* ---------------- FLASHCARD MODE ---------------- */
function renderCard(){
  const words = VOCAB[currentLesson].words;
  const w = words[cardIndex];
  const el = document.getElementById('flipCard');
  el.classList.remove('flipped');
  document.getElementById('cardHanzi').textContent = w[0];
  document.getElementById('cardPinyin').textContent = w[1];
  document.getElementById('cardMeaning').textContent = w[2];
  document.getElementById('cardExampleZh').textContent = w[3];
  document.getElementById('cardsProgress').textContent = 'Từ ' + (cardIndex+1) + ' / ' + words.length;
  renderCardsGrid();
}

function renderCardsGrid(){
  const words = VOCAB[currentLesson].words;
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  const c = LESSON_COLORS[currentLesson];
  words.forEach((w,i)=>{
    const d = document.createElement('div');
    d.className = 'mini-card' + (i===cardIndex?' current':'');
    d.style.background = i%2===0 ? c.a : c.b;
    d.textContent = w[0];
    d.addEventListener('click', ()=>{ cardIndex=i; renderCard(); });
    grid.appendChild(d);
  });
}

document.getElementById('flipCard').addEventListener('click', ()=>{
  document.getElementById('flipCard').classList.toggle('flipped');
});
document.getElementById('cardFlip').addEventListener('click', ()=>{
  document.getElementById('flipCard').classList.toggle('flipped');
});
document.getElementById('cardPrev').addEventListener('click', ()=>{
  const n = VOCAB[currentLesson].words.length;
  cardIndex = (cardIndex-1+n)%n;
  renderCard();
});
document.getElementById('cardNext').addEventListener('click', ()=>{
  const n = VOCAB[currentLesson].words.length;
  cardIndex = (cardIndex+1)%n;
  renderCard();
});

/* ---------------- REVIEW (SHUFFLE) MODE ---------------- */
function initReview(){
  const n = VOCAB[currentLesson].words.length;
  reviewOrder = shuffle([...Array(n).keys()]);
  reviewIndex = 0;
}
function renderReview(){
  const words = VOCAB[currentLesson].words;
  const w = words[reviewOrder[reviewIndex]];
  const el = document.getElementById('reviewCard');
  el.classList.remove('flipped');
  document.getElementById('reviewHanzi').textContent = w[0];
  document.getElementById('reviewPinyin').textContent = w[1];
  document.getElementById('reviewMeaning').textContent = w[2];
  document.getElementById('reviewExampleZh').textContent = w[3];
  document.getElementById('reviewProgress').textContent = 'Từ ' + (reviewIndex+1) + ' / ' + words.length + ' (thứ tự đã xáo trộn)';
}
document.getElementById('reviewCard').addEventListener('click', ()=>{
  document.getElementById('reviewCard').classList.toggle('flipped');
});
document.getElementById('reviewShuffle').addEventListener('click', ()=>{
  initReview();
  renderReview();
});
document.getElementById('reviewNext').addEventListener('click', ()=>{
  const n = VOCAB[currentLesson].words.length;
  reviewIndex = (reviewIndex+1)%n;
  if(reviewIndex===0){ reviewOrder = shuffle(reviewOrder); }
  renderReview();
});

/* ---------------- FILL IN THE BLANK MODE ---------------- */
function initFill(){
  const n = VOCAB[currentLesson].words.length;
  fillOrder = shuffle([...Array(n).keys()]);
  fillIndex = 0;
  fillScore = {correct:0, total:0};
  fillAnswered = false;
}
function renderFill(){
  const words = VOCAB[currentLesson].words;
  const idx = fillOrder[fillIndex];
  const w = words[idx];
  fillAnswered = false;
  const blanked = w[3].replace(w[0], '<span class="fb-blank">＿＿＿</span>');
  document.getElementById('fillSentence').innerHTML = blanked;
  document.getElementById('fillMeaningHint').textContent = '💡 Gợi ý nghĩa của từ: ' + w[2];
  document.getElementById('fillProgress').textContent = 'Câu ' + (fillIndex+1) + ' / ' + words.length;
  document.getElementById('fillScore').textContent = 'Điểm: ' + fillScore.correct + ' / ' + fillScore.total;

  // build options: correct + 3 distractors from same lesson
  const others = words.filter((_,i)=>i!==idx).map(x=>x[0]);
  const distractors = shuffle(others).slice(0,3);
  const options = shuffle([w[0], ...distractors]);

  const optWrap = document.getElementById('fillOptions');
  optWrap.innerHTML = '';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'fb-opt';
    b.textContent = opt;
    b.addEventListener('click', ()=>{
      if(fillAnswered) return;
      fillAnswered = true;
      fillScore.total++;
      if(opt===w[0]){
        b.classList.add('correct');
        fillScore.correct++;
      } else {
        b.classList.add('wrong');
        optWrap.querySelectorAll('.fb-opt').forEach(x=>{
          if(x.textContent===w[0]) x.classList.add('correct');
        });
      }
      document.getElementById('fillScore').textContent = 'Điểm: ' + fillScore.correct + ' / ' + fillScore.total;
    });
    optWrap.appendChild(b);
  });
}
document.getElementById('fillNext').addEventListener('click', ()=>{
  const n = VOCAB[currentLesson].words.length;
  fillIndex = (fillIndex+1)%n;
  if(fillIndex===0){ fillOrder = shuffle(fillOrder); }
  renderFill();
});
document.getElementById('fillRestart').addEventListener('click', ()=>{
  initFill();
  renderFill();
});

buildModeTabs();
selectLesson('L6');
