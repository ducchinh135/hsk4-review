<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170">
<defs>
<radialGradient id="rock" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#b07a52"/><stop offset=".55" stop-color="#5b3722"/><stop offset="1" stop-color="#22110a"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient>
<linearGradient id="fo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a1a"/><stop offset=".6" stop-color="#e8321c" stop-opacity=".85"/><stop offset="1" stop-color="#b3122f" stop-opacity="0"/></linearGradient>
<linearGradient id="fm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb020"/><stop offset=".6" stop-color="#ff7a18" stop-opacity=".85"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient>
<linearGradient id="fi" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fffbd0"/><stop offset=".6" stop-color="#ffe066" stop-opacity=".9"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></linearGradient>
</defs>
<style>
.f{transform-box:fill-box;transform-origin:50% 100%}
.f1{animation:fl .7s ease-in-out infinite alternate}
.f2{animation:fl .5s ease-in-out -.2s infinite alternate}
.f3{animation:fl .35s ease-in-out -.1s infinite alternate}
@keyframes fl{0%{transform:scale(1,.9) skewX(-4deg)}100%{transform:scale(.92,1.12) skewX(5deg)}}
.e{animation:em 1.2s linear infinite;opacity:0}
@keyframes em{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.gl{transform-box:fill-box;transform-origin:center;animation:gp 1s ease-in-out infinite alternate}
@keyframes gp{0%{opacity:.6;transform:scale(.95)}100%{opacity:1;transform:scale(1.08)}}
.cr{animation:cp .9s ease-in-out infinite alternate}
@keyframes cp{0%{opacity:.45}100%{opacity:1}}
</style>
<circle class="gl" cx="60" cy="118" r="52" fill="url(#glow)"/>
