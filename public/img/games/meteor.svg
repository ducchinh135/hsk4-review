<circle cx="60" cy="118" r="30" fill="url(#rock)"/>
<circle cx="60" cy="118" r="30" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
<ellipse cx="50" cy="126" rx="7" ry="5" fill="#2a160c" opacity=".7"/><ellipse cx="70" cy="112" rx="5" ry="4" fill="#2a160c" opacity=".7"/><ellipse cx="62" cy="132" rx="4" ry="3" fill="#2a160c" opacity=".6"/>
<path class="cr" d="M44 104 L52 114 L48 126" fill="none" stroke="#ff9d2e" stroke-width="2" stroke-linecap="round"/>
